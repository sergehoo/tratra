# docker-compose.staging.yml — pile STAGING de Tratra, isolée de la production.
#
#   Projet Compose  : tratra-staging (volumes et réseau interne préfixés → base PostgreSQL, Redis et MinIO SÉPARÉS)
#   Traefik         : le même Traefik externe que la production (réseau « proxy », résolveur « lets »), mais TOUS les
#                     routeurs / middlewares / services portent le préfixe « tratra-stg- » et chaque service joint au
#                     réseau partagé « proxy » a un nom en « -stg » : aucune collision possible avec la production.
#   Secrets         : aucun dans ce fichier. Valeurs dans .env (copie de .env.staging.example, jamais versionnée) ;
#                     compte de service Firebase dans ./secrets/ (jamais versionné, jamais dans l'image).
#
#   Traefik         : résolveur ACME = TRAEFIK_CERTRESOLVER (défaut « lets », comme la production). Dokploy : « letsencrypt » + PROXY_NETWORK=dokploy-network.
#
# Commandes : voir docs/deploiement-staging.md   (DC="docker compose -f docker-compose.staging.yml")

name: tratra-staging

x-backend: &backend
  image: tratra-backend:${IMAGE_TAG:-staging}
  env_file: .env
  # Compte de service Firebase (push FCM) : dossier monté en lecture seule, facultatif (sans fichier : aucun push).
  volumes:
    - ./secrets:/run/tratra-secrets:ro
  restart: unless-stopped

networks:
  web:            # réseau interne du projet (db, redis, minio, workers)
    driver: bridge
  proxy:          # réseau Traefik partagé (créé hors de ce fichier : docker network create proxy)
    external: true
    name: ${PROXY_NETWORK:-proxy}

volumes:
  postgres_data:
  static_volume:
  media_volume:
  minio_data:

services:
  # --- PostgreSQL + PostGIS : base STAGING dédiée -----------------------------------------------------------------
  tratradb:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [web]
    restart: unless-stopped

  # --- Redis : broker Celery, cache et couche de canaux WebSocket ---------------------------------------------------
  redis:
    image: redis:7
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [web]
    restart: unless-stopped

  # --- MinIO : stockage objet STAGING (média + KYC privé), distinct de la production --------------------------------
  # MinIO n'est plus publié sur Docker Hub / quay.io (« pull access denied ») : l'image est CONSTRUITE depuis les sources officielles aux
  # mêmes versions épinglées (docker/minio/Dockerfile) ; le client `mc` est dans la même image.
  minio-stg:
    image: tratra-minio:${IMAGE_TAG:-staging}
    build:
      context: ./docker/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks: [web, proxy]
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=${PROXY_NETWORK:-proxy}
      - traefik.http.routers.tratra-stg-minio-api.rule=Host(`${MINIO_API_HOST}`)
      - traefik.http.routers.tratra-stg-minio-api.entrypoints=websecure
      - traefik.http.routers.tratra-stg-minio-api.tls.certresolver=${TRAEFIK_CERTRESOLVER:-lets}
      - traefik.http.routers.tratra-stg-minio-api.service=tratra-stg-minio-api
      - traefik.http.services.tratra-stg-minio-api.loadbalancer.server.port=9000
      # Console MinIO (:9001) : JAMAIS exposée publiquement (réseau interne / tunnel SSH uniquement).

  # Crée les buckets média et KYC privé (aucune politique anonyme : URL signées uniquement).
  minio-init:
    image: tratra-minio:${IMAGE_TAG:-staging}
    pull_policy: never          # construite par minio-stg (même tag)
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME}
      KYC_STORAGE_BUCKET_NAME: ${KYC_STORAGE_BUCKET_NAME}
    depends_on:
      minio-stg:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -ec
      - |
        until mc alias set local http://minio-stg:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 2; done
        mc mb --ignore-existing "local/$${AWS_STORAGE_BUCKET_NAME}"
        mc mb --ignore-existing "local/$${KYC_STORAGE_BUCKET_NAME}"
        mc anonymous set none "local/$${AWS_STORAGE_BUCKET_NAME}"
        mc anonymous set none "local/$${KYC_STORAGE_BUCKET_NAME}"
    networks: [web]

  # --- API Django HTTP (WSGI, gunicorn) — les WebSocket /ws/ sont servies par tratraws-stg (Daphne) --------------------
  # L'entrypoint attend db/redis, lance « check --deploy », les migrations, l'éligibilité, collectstatic, puis gunicorn.
  tratraweb-stg:
    <<: *backend
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/docker/entrypoint.sh", "gunicorn", "tratra.wsgi:application", "-c", "/app/docker/gunicorn.conf.py"]
    environment:
      DB_CONN_MAX_AGE: ${WEB_DB_CONN_MAX_AGE:-60}   # connexions PostgreSQL gardées ouvertes (WSGI uniquement)
    depends_on:
      tratradb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      # La production impose HTTPS (SECURE_SSL_REDIRECT) et un hôte autorisé : une sonde sur 127.0.0.1 en HTTP reçoit
      # 400/301 et ne passe JAMAIS. On présente donc l'hôte public et l'en-tête de protocole posé par Traefik.
      test:
        - CMD-SHELL
        - 'wget -qO- --header="Host: $${tratraweb_HOST}" --header="X-Forwarded-Proto: https" http://127.0.0.1:8000/readyz > /dev/null || exit 1'
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ./secrets:/run/tratra-secrets:ro
    networks:
      web:
      proxy:
        aliases: [tratraweb-stg]
    labels:
      - traefik.enable=true
      - traefik.docker.network=${PROXY_NETWORK:-proxy}
      - traefik.http.routers.tratra-stg-api.rule=Host(`${tratraweb_HOST}`)
      - traefik.http.routers.tratra-stg-api.entrypoints=websecure
      - traefik.http.routers.tratra-stg-api.tls.certresolver=${TRAEFIK_CERTRESOLVER:-lets}
      - traefik.http.routers.tratra-stg-api.middlewares=tratra-stg-sec@docker,tratra-stg-compress@docker,tratra-stg-rl@docker,tratra-stg-noindex@docker
      - traefik.http.routers.tratra-stg-api.service=tratra-stg-api-svc
      - traefik.http.services.tratra-stg-api-svc.loadbalancer.server.port=8000
      - traefik.http.middlewares.tratra-stg-sec.headers.stsSeconds=31536000
      - traefik.http.middlewares.tratra-stg-sec.headers.contentTypeNosniff=true
      - traefik.http.middlewares.tratra-stg-sec.headers.frameDeny=true
      - traefik.http.middlewares.tratra-stg-sec.headers.referrerPolicy=strict-origin-when-cross-origin
      - traefik.http.middlewares.tratra-stg-compress.compress=true
      - traefik.http.middlewares.tratra-stg-rl.ratelimit.average=150
      - traefik.http.middlewares.tratra-stg-rl.ratelimit.burst=250
      - traefik.http.middlewares.tratra-stg-noindex.headers.customresponseheaders.X-Robots-Tag=noindex,nofollow

  # --- WebSocket uniquement (Daphne, ASGI) : messagerie, statuts, suivi en direct — /ws/ du même hôte que l'API -------
  tratraws-stg:
    <<: *backend
    pull_policy: never          # image construite par tratraweb-stg (même tag)
    command: ["/app/docker/entrypoint.sh", "daphne", "-b", "0.0.0.0", "-p", "8000", "tratra.asgi:application"]
    environment:
      RUN_MIGRATIONS: "0"
      COLLECTSTATIC: skip
      DB_CONN_MAX_AGE: "0"      # ASGI : jamais de connexion gardée ouverte
    depends_on:
      tratraweb-stg:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - 'wget -qO- --header="Host: $${tratraweb_HOST}" --header="X-Forwarded-Proto: https" http://127.0.0.1:8000/readyz > /dev/null || exit 1'
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      web:
      proxy:
        aliases: [tratraws-stg]
    labels:
      - traefik.enable=true
      - traefik.docker.network=${PROXY_NETWORK:-proxy}
      - traefik.http.routers.tratra-stg-ws.rule=Host(`${tratraweb_HOST}`) && PathPrefix(`/ws/`)
      - traefik.http.routers.tratra-stg-ws.priority=100
      - traefik.http.routers.tratra-stg-ws.entrypoints=websecure
      - traefik.http.routers.tratra-stg-ws.tls.certresolver=${TRAEFIK_CERTRESOLVER:-lets}
      - traefik.http.routers.tratra-stg-ws.middlewares=tratra-stg-sec@docker,tratra-stg-rl@docker,tratra-stg-noindex@docker
      - traefik.http.routers.tratra-stg-ws.service=tratra-stg-ws-svc
      - traefik.http.services.tratra-stg-ws-svc.loadbalancer.server.port=8000

  # --- Frontend Next.js (variables NEXT_PUBLIC_* figées à la construction) ------------------------------------------
  tratrafrontend-stg:
    image: tratra-frontend:${IMAGE_TAG:-staging}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE}
        NEXT_PUBLIC_PAYMENT_METHODS: ${NEXT_PUBLIC_PAYMENT_METHODS:-cash}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://${FRONTEND_HOST}}
        NEXT_PUBLIC_MEDIA_ORIGINS: ${AWS_S3_ENDPOINT_URL:-},${NEXT_PUBLIC_MEDIA_ORIGINS:-}
        NEXT_PUBLIC_ESCROW_ENABLED: ${NEXT_PUBLIC_ESCROW_ENABLED:-false}
        # Anti-robot Cloudflare Turnstile (clé PUBLIQUE ; vide = désactivé) — la clé secrète va dans .env (TURNSTILE_SECRET_KEY).
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    depends_on:
      tratraweb-stg:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      proxy:
        aliases: [tratrafrontend-stg]
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=${PROXY_NETWORK:-proxy}
      - traefik.http.routers.tratra-stg-front.rule=Host(`${FRONTEND_HOST}`)
      - traefik.http.routers.tratra-stg-front.entrypoints=websecure
      - traefik.http.routers.tratra-stg-front.tls.certresolver=${TRAEFIK_CERTRESOLVER:-lets}
      - traefik.http.routers.tratra-stg-front.middlewares=tratra-stg-noindex@docker
      - traefik.http.routers.tratra-stg-front.service=tratra-stg-front-svc
      - traefik.http.services.tratra-stg-front-svc.loadbalancer.server.port=3000

  # --- Celery : un worker par file (flash, otp, default, bulk — routage explicite, voir tratra/settings/base.py) -------
  # Le worker par défaut vide aussi « notifications » et « celery » (producteurs d'anciennes versions pendant une mise à jour).
  worker:
    <<: *backend
    pull_policy: never          # l'image est construite par tratraweb-stg (même tag) ; ne jamais la chercher en ligne
    command: celery -A tratra worker -n default@%h -l info --prefetch-multiplier=1 --max-tasks-per-child=200 --concurrency=${CELERY_DEFAULT_CONCURRENCY:-2} --queues=default,notifications,celery
    depends_on:
      tratraweb-stg:
        condition: service_healthy   # migrations terminées
    healthcheck:
      test: ["CMD-SHELL", "celery -A tratra inspect ping -d default@$$HOSTNAME --timeout 5 | grep -q pong || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    networks: [web]

  worker-flash:
    <<: *backend
    pull_policy: never
    command: celery -A tratra worker -n flash@%h -l info --prefetch-multiplier=1 --max-tasks-per-child=500 --concurrency=${CELERY_FLASH_CONCURRENCY:-2} --queues=flash
    depends_on:
      tratraweb-stg:
        condition: service_healthy
    networks: [web]

  worker-otp:
    <<: *backend
    pull_policy: never
    command: celery -A tratra worker -n otp@%h -l info --prefetch-multiplier=1 --max-tasks-per-child=500 --concurrency=${CELERY_OTP_CONCURRENCY:-1} --queues=otp
    depends_on:
      tratraweb-stg:
        condition: service_healthy
    networks: [web]

  worker-bulk:
    <<: *backend
    pull_policy: never
    command: celery -A tratra worker -n bulk@%h -l info --prefetch-multiplier=1 --max-tasks-per-child=100 --concurrency=${CELERY_BULK_CONCURRENCY:-2} --queues=bulk
    depends_on:
      tratraweb-stg:
        condition: service_healthy
    networks: [web]

  # --- Celery beat : réévaluation des badges (1 h), maintenances préventives (24 h), purge GPS (1 h) ------------------
  beat:
    <<: *backend
    pull_policy: never
    command: celery -A tratra beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      tratraweb-stg:
        condition: service_healthy
    networks: [web]

  # --- Adminer : UNIQUEMENT à la demande (docker compose --profile tools up -d adminer-stg), jamais routé par Traefik ----------------
  # Aucun port publié : `docker compose --profile tools run --rm -p 127.0.0.1:18081:8080 adminer-stg`, puis tunnel SSH vers 127.0.0.1:18081.
  adminer-stg:
    profiles: ["tools"]
    image: adminer:4
    environment:
      ADMINER_DEFAULT_SERVER: tratradb
    networks: [web]
    restart: "no"
