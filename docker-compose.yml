#/Users/ogahserge/Documents/tratra/docker-compose.yml
# docker-compose.yml (stack de l’app tratra — sans Traefik)
# Traefik tourne dans un autre compose et expose 80/443
# Assure-toi que le réseau externe "proxy" existe:  docker network ls | grep proxy || docker network create proxy

networks:
  web:          # réseau interne de l’app
    driver: bridge
  proxy:        # réseau partagé avec Traefik (externe)
    external: true

volumes:
  postgres_data:
  static_volume:
  media_volume:
  minio_data: { }
  redis_broker_data: { }      # profil « redis-split » seulement
 
services:
  # --- Base de données Postgres + PostGIS ---
  tratradb:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [web]
    restart: unless-stopped
  # MinIO n'est plus publié sur Docker Hub / quay.io (« pull access denied ») : l'image est CONSTRUITE depuis les sources officielles aux
  # mêmes versions épinglées (docker/minio/Dockerfile) ; le client `mc` est dans la même image. Même version que l'ancienne image : le
  # volume `minio_data` existant est relu tel quel (aucune migration de données).
  minio:
    image: tratra-minio:prod
    build:
      context: ./docker/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - web
      - proxy
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy

      # === API S3 ===
      - traefik.http.routers.minio-api.rule=Host(`${MINIO_API_HOST}`)
      - traefik.http.routers.minio-api.entrypoints=websecure
      - traefik.http.routers.minio-api.tls.certresolver=lets
      - traefik.http.routers.minio-api.service=minio-api
      - traefik.http.services.minio-api.loadbalancer.server.port=9000

      # === Console MinIO (:9001) : JAMAIS exposée publiquement ===
      # Seule l'API S3 (signatures temporaires) passe par Traefik. La console reste joignable depuis le réseau interne uniquement
      # (docker exec / tunnel SSH : `docker compose exec minio mc ...` ou `ssh -L 9001:<ip conteneur>:9001 serveur`).

  # Creates the public-media and private-KYC buckets before Django starts.
  # No anonymous policy is granted: application code produces short-lived
  # signed URLs only when an authorised user needs an object.
  minio-init:
    image: tratra-minio:prod
    pull_policy: never          # construite par le service minio (même étiquette)
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME}
      KYC_STORAGE_BUCKET_NAME: ${KYC_STORAGE_BUCKET_NAME}
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -ec
      - |
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 2; done
        mc mb --ignore-existing "local/$${AWS_STORAGE_BUCKET_NAME}"
        mc mb --ignore-existing "local/$${KYC_STORAGE_BUCKET_NAME}"
        mc anonymous set none "local/$${AWS_STORAGE_BUCKET_NAME}"
        mc anonymous set none "local/$${KYC_STORAGE_BUCKET_NAME}"
    networks: [web]


  # --- Redis (broker Celery + cache + Channels) ---
  redis:
    image: redis:7
    command: ["redis-server","--save","","--appendonly","no"]
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [web]
    restart: unless-stopped

  # --- tratraweb : API HTTP Django (WSGI, gunicorn) — Daphne ne sert plus que les WebSocket (service tratraws) ---
  tratraweb:
    build:
      context: .
      dockerfile: Dockerfile
    # Image unique du backend : construite ici, réutilisée telle quelle par tratraws, les workers et beat (même code partout).
    image: tratra-backend:${IMAGE_TAG:-prod}
    env_file: .env
    # Entrypoint : contrôle DB/Redis, migrations, éligibilité recalculée, collectstatic… puis gunicorn (docker/gunicorn.conf.py :
    # WEB_CONCURRENCY processus × GUNICORN_THREADS fils). Seul ce service lance les migrations.
    command: ["/app/docker/entrypoint.sh", "gunicorn", "tratra.wsgi:application", "-c", "/app/docker/gunicorn.conf.py"]
    environment:
      DB_CONN_MAX_AGE: ${WEB_DB_CONN_MAX_AGE:-60}   # connexions PostgreSQL gardées ouvertes (WSGI uniquement)
    depends_on:
      tratradb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      # La production impose HTTPS (SECURE_SSL_REDIRECT) et un hôte autorisé : une sonde nue sur 127.0.0.1 reçoit 400/301 et ne passe JAMAIS
      # (le conteneur resterait « unhealthy » et le worker, beat et le frontend ne démarreraient pas). On présente donc l'hôte public de l'API
      # (tratraweb_HOST, présent dans .env et dans ALLOWED_HOSTS) et l'en-tête de protocole que pose Traefik.
      test:
        - CMD-SHELL
        - 'wget -qO- --header="Host: $${tratraweb_HOST}" --header="X-Forwarded-Proto: https" http://127.0.0.1:8000/readyz > /dev/null || exit 1'
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s       # migrations et collectstatic au démarrage
    # Labels Traefik: route HTTPS -> service tratraweb:8000
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy

      # Router unique (HTTPS) – utilise une variable d'env claire
      # Dans .env : TRATRA_HOST=tratra.net
      - traefik.http.routers.tratraweb.rule=Host(`${tratraweb_HOST}`)
      - traefik.http.routers.tratraweb.entrypoints=websecure
      - traefik.http.routers.tratraweb.tls.certresolver=lets

      # Middlewares
      - traefik.http.routers.tratraweb.middlewares=tratraweb-sec-headers@docker,tratraweb-compress@docker,tratraweb-rl@docker

      - traefik.http.middlewares.tratraweb-sec-headers.headers.stsSeconds=31536000
      - traefik.http.middlewares.tratraweb-sec-headers.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.tratraweb-sec-headers.headers.stsPreload=true
      - traefik.http.middlewares.tratraweb-sec-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.tratraweb-sec-headers.headers.frameDeny=true
      - traefik.http.middlewares.tratraweb-sec-headers.headers.referrerPolicy=strict-origin-when-cross-origin
      - traefik.http.middlewares.tratraweb-compress.compress=true
      - traefik.http.middlewares.tratraweb-rl.ratelimit.average=150
      - traefik.http.middlewares.tratraweb-rl.ratelimit.burst=250

      # Service explicite (port d'écoute interne)
      - traefik.http.services.tratraweb-svc.loadbalancer.server.port=8000
      - traefik.http.routers.tratraweb.service=tratraweb-svc

    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      # Compte de service Firebase (push FCM) : ./secrets/fcm-service-account.json, hors Git et hors image, lecture seule.
      # Sans fichier : aucun push, aucune erreur (le Back-Office affiche « Firebase non configuré »). Voir docs/push-fcm.md.
      - ./secrets:/run/tratra-secrets:ro
    # L'adresse PUBLIQUE de MinIO (https://${MINIO_API_HOST}, celle des liens signés) doit aussi être joignable DEPUIS les conteneurs : depuis un
    # conteneur, l'IP publique du serveur n'est souvent pas atteignable (hairpin / pare-feu) et chaque opération sur un fichier expire
    # (« Connection to minioapi… timed out »). Ce nom pointe donc vers la passerelle de l'hôte, où Traefik écoute sur 443 (même certificat).
    extra_hosts:
      - "${MINIO_API_HOST}:host-gateway"
    networks:
      - web     # parle à db/redis
      - proxy   # exposé à Traefik
    restart: unless-stopped

  # --- tratraws : WebSocket uniquement (Daphne, ASGI) — messagerie, statuts et suivi en direct (/ws/…) ---
  # Même image et même authentification (billets signés de 60 s délivrés par l'API HTTP). Traefik lui envoie /ws/ seulement
  # (routeur prioritaire) ; aucune migration ni collectstatic ici (faits par tratraweb, dont il attend la bonne santé).
  tratraws:
    image: tratra-backend:${IMAGE_TAG:-prod}
    pull_policy: never          # image construite par tratraweb (même code)
    env_file: .env
    command: ["/app/docker/entrypoint.sh", "daphne", "-b", "0.0.0.0", "-p", "8000", "tratra.asgi:application"]
    environment:
      RUN_MIGRATIONS: "0"
      COLLECTSTATIC: skip
      DB_CONN_MAX_AGE: "0"      # ASGI : jamais de connexion gardée ouverte
    depends_on:
      tratraweb:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - 'wget -qO- --header="Host: $${tratraweb_HOST}" --header="X-Forwarded-Proto: https" http://127.0.0.1:8000/readyz > /dev/null || exit 1'
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      # Même hôte que l'API, chemins /ws/ seulement ; priorité au-dessus du routeur de l'API (qui prend tout le reste).
      - traefik.http.routers.tratraws.rule=Host(`${tratraweb_HOST}`) && PathPrefix(`/ws/`)
      - traefik.http.routers.tratraws.priority=100
      - traefik.http.routers.tratraws.entrypoints=websecure
      - traefik.http.routers.tratraws.tls.certresolver=lets
      # Pas de compression (WebSocket) ; mêmes en-têtes de sécurité et même limite d'ouvertures que l'API.
      - traefik.http.routers.tratraws.middlewares=tratraweb-sec-headers@docker,tratraweb-rl@docker
      - traefik.http.services.tratraws-svc.loadbalancer.server.port=8000
      - traefik.http.routers.tratraws.service=tratraws-svc
    volumes:
      - ./secrets:/run/tratra-secrets:ro
    networks:
      - web
      - proxy
    restart: unless-stopped

  # --- Frontend Next.js ---
  tratrafrontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* is embedded at build time by Next.js.
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE}
        NEXT_PUBLIC_PAYMENT_METHODS: ${NEXT_PUBLIC_PAYMENT_METHODS:-cash}
        # Canonical/sitemap/Open Graph URL; defaults to the Traefik frontend host.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://${FRONTEND_HOST}}
        # CSP img-src (frozen at build): the MinIO/S3 endpoint that signs media
        # URLs, plus optional extra origins. Empty items are ignored.
        NEXT_PUBLIC_MEDIA_ORIGINS: ${AWS_S3_ENDPOINT_URL:-},${NEXT_PUBLIC_MEDIA_ORIGINS:-}
        NEXT_PUBLIC_ESCROW_ENABLED: ${NEXT_PUBLIC_ESCROW_ENABLED:-false}
        # Anti-robot Cloudflare Turnstile (clé PUBLIQUE ; vide = désactivé) — la clé secrète va dans .env (TURNSTILE_SECRET_KEY).
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    depends_on:
      tratraweb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.tratrafrontend.rule=Host(`${FRONTEND_HOST}`)
      - traefik.http.routers.tratrafrontend.entrypoints=websecure
      - traefik.http.routers.tratrafrontend.tls.certresolver=lets
      - traefik.http.services.tratrafrontend.loadbalancer.server.port=3000
    networks:
      - proxy
    restart: unless-stopped

  # --- Celery : un worker par file (routage explicite : CELERY_TASK_ROUTES et handy.notifications.push_queue) ---
  # Une file engorgée n'en retarde aucune autre. flash : nouvelles missions et échéances (90 s pour répondre) ; otp : SMS
  # asynchrones ; default : push courants, paiements, tâches légères (+ ancienne file « notifications ») ; bulk : annonces de masse,
  # réévaluations, purges. Concurrence réglable par file (CELERY_*_CONCURRENCY). Tous envoient des push : compte Firebase monté.
  worker:
    image: tratra-backend:${IMAGE_TAG:-prod}
    pull_policy: never          # image construite par tratraweb (même code)
    env_file: .env
    command: celery -A tratra worker -n default@%h -l info --prefetch-multiplier=1 --max-tasks-per-child=200 --concurrency=${CELERY_DEFAULT_CONCURRENCY:-2} --queues=default,notifications
    # Le worker ENVOIE les push (tâche send_notification_push) : il doit lire le même compte de service Firebase.
    volumes:
      - ./secrets:/run/tratra-secrets:ro
    depends_on:
      tratraweb:
        condition: service_healthy   # migrations terminées
      tratradb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    # L'adresse PUBLIQUE de MinIO (https://${MINIO_API_HOST}, celle des liens signés) doit aussi être joignable DEPUIS les conteneurs : depuis un
    # conteneur, l'IP publique du serveur n'est souvent pas atteignable (hairpin / pare-feu) et chaque opération sur un fichier expire
    # (« Connection to minioapi… timed out »). Ce nom pointe donc vers la passerelle de l'hôte, où Traefik écoute sur 443 (même certificat).
    extra_hosts:
      - "${MINIO_API_HOST}:host-gateway"
    networks: [web]
    restart: unless-stopped

  worker-flash:
    image: tratra-backend:${IMAGE_TAG:-prod}
    pull_policy: never          # image construite par tratraweb
    env_file: .env
    command: celery -A tratra worker -n flash@%h -l info --prefetch-multiplier=1 --max-tasks-per-child=500 --concurrency=${CELERY_FLASH_CONCURRENCY:-2} --queues=flash
    volumes:
      - ./secrets:/run/tratra-secrets:ro
    depends_on:
      worker:
        condition: service_started
    networks: [web]
    restart: unless-stopped

  worker-otp:
    image: tratra-backend:${IMAGE_TAG:-prod}
    pull_policy: never
    env_file: .env
    command: celery -A tratra worker -n otp@%h -l info --prefetch-multiplier=1 --max-tasks-per-child=500 --concurrency=${CELERY_OTP_CONCURRENCY:-1} --queues=otp
    depends_on:
      worker:
        condition: service_started
    networks: [web]
    restart: unless-stopped

  worker-bulk:
    image: tratra-backend:${IMAGE_TAG:-prod}
    pull_policy: never
    env_file: .env
    command: celery -A tratra worker -n bulk@%h -l info --prefetch-multiplier=1 --max-tasks-per-child=100 --concurrency=${CELERY_BULK_CONCURRENCY:-2} --queues=bulk
    volumes:
      - ./secrets:/run/tratra-secrets:ro
    depends_on:
      worker:
        condition: service_started
    extra_hosts:
      - "${MINIO_API_HOST}:host-gateway"
    networks: [web]
    restart: unless-stopped

  # --- Celery Beat (planificateur) ---
  beat:
    image: tratra-backend:${IMAGE_TAG:-prod}
    pull_policy: never          # image construite par tratraweb
    env_file: .env
    command: celery -A tratra beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      tratradb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks: [web]
    restart: unless-stopped

  # --- PRÉPARATION DE LA CROISSANCE — services DÉSACTIVÉS par défaut (profils), aucun effet sur la production actuelle -------
  # Activation et retour arrière : docs/scalabilite-phase2.md. Aucun port publié (réseau interne uniquement).
  #
  # PgBouncer : mutualise les connexions PostgreSQL (mode transaction). Activer : `--profile pgbouncer`, puis pour l'API et les workers
  # DB_HOST=pgbouncer, DB_PORT=6432, DB_DISABLE_SERVER_SIDE_CURSORS=true.
  pgbouncer:
    profiles: ["pgbouncer"]
    build:
      context: ./docker/pgbouncer
    image: tratra-pgbouncer:local
    env_file: .env
    environment:
      PGB_DB_HOST: tratradb
      PGB_DB_PORT: "5432"
    depends_on:
      tratradb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -d $${DB_NAME} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [web]
    restart: unless-stopped

  # Redis séparés par usage (profil « redis-split ») : broker Celery PERSISTANT (AOF : une file ne se perd plus au redémarrage),
  # cache et quotas anti-fraude (noeviction : un quota n'est jamais effacé pour faire de la place — mieux vaut un refus qu'une
  # limite remise à zéro), WebSocket (Channels). Activer : CELERY_BROKER_URL=redis://redis-broker:6379/0,
  # CACHE_URL=redis://redis-cache:6379/0, CHANNELS_REDIS_URL=redis://redis-channels:6379/0.
  redis-broker:
    profiles: ["redis-split"]
    image: redis:7
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--save", ""]
    volumes:
      - redis_broker_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [web]
    restart: unless-stopped

  redis-cache:
    profiles: ["redis-split"]
    image: redis:7
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "${REDIS_CACHE_MAXMEMORY:-512mb}", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [web]
    restart: unless-stopped

  redis-channels:
    profiles: ["redis-split"]
    image: redis:7
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [web]
    restart: unless-stopped

  # --- Adminer : OUTIL D'EXPLOITATION, jamais routé par Traefik ni démarré par défaut (profil « tools »). -----------------------
  # Aucun port publié : démarrage ponctuel, lié à 127.0.0.1 de l'hôte (jamais à Internet), puis tunnel SSH depuis ton poste :
  #   serveur : docker compose --profile tools run --rm -p 127.0.0.1:18080:8080 adminer      (Ctrl-C ou fermeture = arrêt et suppression)
  #   poste   : ssh -L 18080:127.0.0.1:18080 utilisateur@serveur   →   http://localhost:18080
  # (le port 8080 de l'hôte appartient à un autre site : on utilise 18080.)
  adminer:
    profiles: ["tools"]
    image: adminer:4
    environment:
      ADMINER_DEFAULT_SERVER: tratradb      # service DB du réseau interne « web »
    networks:
      - web
    restart: "no"
