name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # This deliberately builds from a clean checkout. It prevents ignored or
      # uncommitted frontend source files from masking a broken release.
      - run: npm run verify

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: tratra
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tratra"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_ENV: dev
      DEBUG: "False"
      SECRET_KEY: ci-only-secret-not-for-production
      DB_NAME: tratra
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      MINIO_ENABLED: "False"
      REDIS_HOST: 127.0.0.1
      REDIS_URL: redis://127.0.0.1:6379/0
      STRIPE_WEBHOOK_SECRET: ci-only-webhook-secret
      PAYMENT_WEBHOOK_SECRET: ci-only-payment-secret
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      EMAIL_HOST: localhost
      EMAIL_PORT: "25"
      EMAIL_USE_TLS: "False"
      EMAIL_HOST_USER: ""
      EMAIL_HOST_PASSWORD: ""
      DEFAULT_FROM_EMAIL: no-reply@example.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install GIS system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev libgeos-dev libproj-dev libpq-dev
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Django deployment checks
        run: python manage.py check --deploy
      - name: Production settings check
        env:
          DJANGO_ENV: prod
          SECRET_KEY: CiSyntheticSecret-A1b2C3d4E5f6G7h8I9j0K1l2M3n4O5p6Q7r8S9t0U1v2W3x4Y5z6
          MINIO_ENABLED: "True"
          AWS_ACCESS_KEY_ID: ci-only-access-key
          AWS_SECRET_ACCESS_KEY: ci-only-secret-key
          AWS_STORAGE_BUCKET_NAME: tratra-media
          KYC_STORAGE_BUCKET_NAME: tratra-kyc-private
          AWS_S3_ENDPOINT_URL: https://minio.example.test
          AWS_S3_VERIFY: "True"
          MEDIA_PUBLIC_HOSTS: minio.example.test
          ALLOWED_HOSTS: api.example.test
          CORS_ALLOWED_ORIGINS: https://app.example.test
          CSRF_TRUSTED_ORIGINS: https://app.example.test
        run: python manage.py check --deploy
      - name: Test backend
        run: pytest
